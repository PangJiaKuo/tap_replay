name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 编译Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 上传APK产物
        uses: actions/upload-artifact@v5
        with:
          name: Android-APK
          path: app/build/outputs/apk/debug/*.apk
